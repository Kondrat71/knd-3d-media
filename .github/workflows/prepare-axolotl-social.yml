name: Prepare axolotl social photo
on:
  push:
    paths:
      - '.github/workflows/prepare-axolotl-social.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('photos/axolotl-keychains')
          with Image.open(p/'06.jpg') as im:
              w,h=im.size
              # Extract the existing photograph from the catalog layout, no retouching.
              crop=im.convert('RGB').crop((round(w*76/1056),round(h*370/1408),round(w*980/1056),round(h*1042/1408)))
              assert 0.8 <= crop.width/crop.height <= 1.91
              crop.save(p/'social-2026-11-27.jpg',quality=95,subsampling=0)
              print(crop.size)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add photos/axolotl-keychains/social-2026-11-27.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Crop existing axolotl catalog photo for social posts'
            git push
          fi
