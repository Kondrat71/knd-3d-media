name: Prepare keytag photo for Instagram
on:
  push:
    paths:
      - '.github/workflows/prepare-keytag-social.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fit original photo to Instagram format without changing objects
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          p = Path('photos/keytags')
          im = ImageOps.exif_transpose(Image.open(p/'4.jpg')).convert('RGB')
          im.thumbnail((1350, 1080), Image.Resampling.LANCZOS)
          canvas = Image.new('RGB', (1350, 1080), (241, 238, 230))
          canvas.paste(im, ((1350-im.width)//2, (1080-im.height)//2))
          canvas.save(p/'social-batch-2026-11-25.jpg', quality=95, optimize=True)
          PY
      - name: Save publication photo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add photos/keytags/social-batch-2026-11-25.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare keytag catalogue photo for social media'
            git push
          fi
