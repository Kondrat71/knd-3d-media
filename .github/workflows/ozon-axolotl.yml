name: Ozon axolotl keychains
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ozon-axolotl.yml']

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Ozon category and media before import
        shell: python
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          import json
          import os
          import urllib.error
          import urllib.request

          def api(path, body):
              headers = {
                  'Client-Id': os.environ['OZON_CLIENT_ID'].strip(),
                  'Api-Key': os.environ['OZON_API_KEY'].strip(),
                  'Content-Type': 'application/json',
              }
              request = urllib.request.Request(
                  'https://api-seller.ozon.ru' + path,
                  json.dumps(body).encode(),
                  headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f'Ozon HTTP {error.code} for {path}') from None

          category = {'description_category_id': 17027899, 'type_id': 87458885}
          fields = api('/v1/description-category/attribute', category)['result']
          if not fields:
              raise SystemExit('The keychain category returned no attributes')
          print('KEYCHAIN_FIELDS', json.dumps([
              [field['id'], field['name'], field.get('is_required', False), field.get('dictionary_id', 0)]
              for field in fields
          ], ensure_ascii=False))
          items = api('/v3/product/info/list', {'offer_id': ['KND-AXO-PAIR']})['items']
          if items:
              raise SystemExit('Offer already exists. Check the existing card before importing.')

          repository = os.environ['GITHUB_REPOSITORY']
          revision = os.environ['GITHUB_SHA']
          root = f'https://raw.githubusercontent.com/{repository}/{revision}/photos/axolotl-keychains/'
          for index in range(1, 5):
              with urllib.request.urlopen(f'{root}{index:02}.jpg', timeout=15) as image:
                  if image.read(2) != b'\xff\xd8':
                      raise SystemExit(f'Invalid JPEG for image {index}')
          print('FOUR_IMAGES_VERIFIED')
          print('WAITING_FOR_MEASURED_PACKED_WEIGHT')
