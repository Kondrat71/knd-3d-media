name: Ozon axolotl keychains
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ozon-axolotl.yml']

permissions: {}
concurrency:
  group: ozon-axolotl-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read axolotl listing, fees and stock
        shell: python
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request

          def api(path, body):
              headers = {
                  'Client-Id': os.environ['OZON_CLIENT_ID'].strip(),
                  'Api-Key': os.environ['OZON_API_KEY'].strip(),
                  'Content-Type': 'application/json',
              }
              request = urllib.request.Request(
                  'https://api-seller.ozon.ru' + path,
                  json.dumps(body, ensure_ascii=False).encode(),
                  headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f'Ozon HTTP {error.code} for {path}') from None

          # -----BEGIN CERTIFICATE-----
          # MIIDNzCCAh+gAwIBAgIUNzwUVErkdGVOlzDShgGePt4+jGswDQYJKoZIhvcNAQEL
          # BQAwKzEpMCcGA1UEAwwgS05EIGF4b2xvdGwgcHJpdmF0ZSB2ZXJpZmljYXRpb24w
          # HhcNMjYxMTI2MTc0NTM2WhcNMjYxMTI4MTc0NTM2WjArMSkwJwYDVQQDDCBLTkQg
          # YXhvbG90bCBwcml2YXRlIHZlcmlmaWNhdGlvbjCCASIwDQYJKoZIhvcNAQEBBQAD
          # ggEPADCCAQoCggEBAOKvxwnougLjttfn0VJ7talGXOqD5xUSzmZ7Tp+WUKs7E7eu
          # 6iJW1cMtPXHciDbQ7/yodYXj0TpbbDXKReSrNJixO0NT69mFINAhlZS2lxTDYRj7
          # NMYbHK+17NxE6APGIiQCa/aXdHUYO4EXau7qRPey76NgFjEhUWOmbO0pWdM41F1Q
          # xMUhVluvzaBvNt1SDKZb3a/Q8SO4O+uwkBVhai0BXNI0/CMXNwyDa0L6MB/MsV5E
          # xMI8agPeT7zr+4F31OljK6i/4Kizr9alPSfbPPFriQ/BYHk15qhP+gboKLPXXAjQ
          # l9WPxBYAwkJZeXzdkD4PnlA4h7LIWS1OoY3JYBUCAwEAAaNTMFEwHQYDVR0OBBYE
          # FO+mqu7Q6/TBgREYydbQ267ErS+NMB8GA1UdIwQYMBaAFO+mqu7Q6/TBgREYydbQ
          # 267ErS+NMA8GA1UdEwEB/wQFMAMBAf8wDQYJKoZIhvcNAQELBQADggEBAAMeZyNM
          # 7zhOlu1NyqJi96UgimoYLLf+WvM31JdCRbpbaL9cEnjIYR3SuL4VyM9aGiqwNheX
          # 7utHsD3hi5Iar09GQh8wyW8kRCMGvl6vXUILJ1ga3Obxt7oxAn8ZgipmfAZ3XVIr
          # SOJcZRaLeY+KhWn8oOYyrU7tD5f1sMVCQN51f/peNnu/0Zb56TQXHbX0F9jFL8RD
          # aGVIO7VTA7yJk8Se5Xc8qfgZFnlkdOA1jPa7LrXAZyhsvouLJk2yIEW1vG1S1e5t
          # NPjJA1E0fGlVd/MGL2rBZNrCWcoQTV/H6iaZfXwElU5T1MS0fFw77L03h4PJh8pQ
          # /cBzTQQXykZB+VQ=
          # -----END CERTIFICATE-----
          import base64
          import gzip
          import subprocess
          import tempfile
          from pathlib import Path

          offer = 'KND-AXO-PAIR'
          product = api('/v3/product/info/list', {'offer_id': [offer]})['items'][0]
          sku = int(product.get('sku') or 0)
          rates = api('/v5/product/info/prices', {
              'filter': {'offer_id': [offer], 'visibility': 'ALL'}, 'limit': 1,
          })['items']
          stock = api('/v2/product/info/stocks-by-warehouse/fbs', {
              'offer_id': [offer], 'limit': 100, 'cursor': '',
          }).get('products', [])
          ratings = api('/v1/product/rating-by-sku', {'skus': [sku]}) if sku else {}
          row = {
              'id': product.get('id'), 'sku': sku, 'status': product.get('statuses'),
              'images': product.get('images'), 'stocks': stock, 'prices': rates,
              'ratings': ratings, 'promotions': product.get('promotions', []),
          }
          data = gzip.compress(json.dumps(row, ensure_ascii=False).encode())
          # The job emits only ciphertext. The recipient private key is local.
          certificate_lines = [line.strip()[2:] for line in Path(__file__).read_text().splitlines()
                               if re.match(r'^\s*# (?:[A-Za-z0-9+/]{10,}={0,2}|-----.*CERTIFICATE-----)$', line)]
          with tempfile.TemporaryDirectory() as directory:
              certificate = Path(directory) / 'recipient.pem'
              certificate.write_text('\n'.join(certificate_lines) + '\n')
              encrypted = subprocess.run(
                  ['openssl', 'cms', '-encrypt', '-binary', '-outform', 'DER', '-aes256', str(certificate)],
                  input=data, capture_output=True, check=True,
              ).stdout
          payload = base64.b64encode(encrypted).decode()
          for offset in range(0, len(payload), 3000):
              print('AXO_PRIVATE:' + payload[offset:offset + 3000])
