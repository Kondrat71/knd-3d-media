name: Ozon axolotl keychains
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ozon-axolotl.yml']

permissions: {}
concurrency:
  group: ozon-axolotl-import
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Disable paid reviews for this offer and release ten FBS units
        shell: python
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request

          def api(path, body):
              headers = {
                  'Client-Id': os.environ['OZON_CLIENT_ID'].strip(),
                  'Api-Key': os.environ['OZON_API_KEY'].strip(),
                  'Content-Type': 'application/json',
              }
              request = urllib.request.Request(
                  'https://api-seller.ozon.ru' + path,
                  json.dumps(body, ensure_ascii=False).encode(),
                  headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f'Ozon HTTP {error.code} for {path}') from None

          # -----BEGIN CERTIFICATE-----
          # MIIDNzCCAh+gAwIBAgIUNzwUVErkdGVOlzDShgGePt4+jGswDQYJKoZIhvcNAQEL
          # BQAwKzEpMCcGA1UEAwwgS05EIGF4b2xvdGwgcHJpdmF0ZSB2ZXJpZmljYXRpb24w
          # HhcNMjYxMTI2MTc0NTM2WhcNMjYxMTI4MTc0NTM2WjArMSkwJwYDVQQDDCBLTkQg
          # YXhvbG90bCBwcml2YXRlIHZlcmlmaWNhdGlvbjCCASIwDQYJKoZIhvcNAQEBBQAD
          # ggEPADCCAQoCggEBAOKvxwnougLjttfn0VJ7talGXOqD5xUSzmZ7Tp+WUKs7E7eu
          # 6iJW1cMtPXHciDbQ7/yodYXj0TpbbDXKReSrNJixO0NT69mFINAhlZS2lxTDYRj7
          # NMYbHK+17NxE6APGIiQCa/aXdHUYO4EXau7qRPey76NgFjEhUWOmbO0pWdM41F1Q
          # xMUhVluvzaBvNt1SDKZb3a/Q8SO4O+uwkBVhai0BXNI0/CMXNwyDa0L6MB/MsV5E
          # xMI8agPeT7zr+4F31OljK6i/4Kizr9alPSfbPPFriQ/BYHk15qhP+gboKLPXXAjQ
          # l9WPxBYAwkJZeXzdkD4PnlA4h7LIWS1OoY3JYBUCAwEAAaNTMFEwHQYDVR0OBBYE
          # FO+mqu7Q6/TBgREYydbQ267ErS+NMB8GA1UdIwQYMBaAFO+mqu7Q6/TBgREYydbQ
          # 267ErS+NMA8GA1UdEwEB/wQFMAMBAf8wDQYJKoZIhvcNAQELBQADggEBAAMeZyNM
          # 7zhOlu1NyqJi96UgimoYLLf+WvM31JdCRbpbaL9cEnjIYR3SuL4VyM9aGiqwNheX
          # 7utHsD3hi5Iar09GQh8wyW8kRCMGvl6vXUILJ1ga3Obxt7oxAn8ZgipmfAZ3XVIr
          # SOJcZRaLeY+KhWn8oOYyrU7tD5f1sMVCQN51f/peNnu/0Zb56TQXHbX0F9jFL8RD
          # aGVIO7VTA7yJk8Se5Xc8qfgZFnlkdOA1jPa7LrXAZyhsvouLJk2yIEW1vG1S1e5t
          # NPjJA1E0fGlVd/MGL2rBZNrCWcoQTV/H6iaZfXwElU5T1MS0fFw77L03h4PJh8pQ
          # /cBzTQQXykZB+VQ=
          # -----END CERTIFICATE-----

          import base64
          import gzip
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          def private_report(report):
              certificate_lines = [line.strip()[2:] for line in Path(__file__).read_text().splitlines()
                                   if re.match(r'^\s*# (?:[A-Za-z0-9+/]{10,}={0,2}|-----.*CERTIFICATE-----)$', line)]
              with tempfile.TemporaryDirectory() as directory:
                  certificate = Path(directory) / 'recipient.pem'
                  certificate.write_text('\n'.join(certificate_lines) + '\n')
                  encrypted = subprocess.run(
                      ['openssl', 'cms', '-encrypt', '-binary', '-outform', 'DER', '-aes256', str(certificate)],
                      input=gzip.compress(json.dumps(report, ensure_ascii=False).encode()),
                      capture_output=True, check=True,
                  ).stdout
              payload = base64.b64encode(encrypted).decode()
              for offset in range(0, len(payload), 3000):
                  print('AXO_PRIVATE:' + payload[offset:offset + 3000], flush=True)

          def safe_errors(errors):
              return [{key: value for key in ('field', 'code', 'level')
                       if re.fullmatch(r'[\w.\-]{1,80}', value := str(error.get(key, '')))}
                      for error in (errors or [])]

          offer = 'KND-AXO-PAIR'
          expected_product = 7139938159
          expected_sku = 6487393043
          product_filter = {'offer_id': [offer], 'visibility': 'ALL'}

          def read_product():
              row = api('/v3/product/info/list', {'offer_id': [offer]})['items'][0]
              if int(row['id']) != expected_product or int(row.get('sku') or 0) != expected_sku:
                  raise SystemExit('Offer identity changed')
              return row

          def read_rating():
              return api('/v1/product/rating-by-sku', {'skus': [expected_sku]})['products'][0]

          from decimal import Decimal

          def review_status(product):
              return next((row.get('is_enabled') for row in product.get('promotions', [])
                           if row.get('type') == 'REVIEWS_PROMO'), None)

          def dimensions(row):
              return [int(row[k]) for k in ('depth', 'width', 'height', 'weight')]

          def read_attributes():
              row = api('/v4/product/info/attributes', {'filter': product_filter, 'limit': 1})['result'][0]
              if row.get('offer_id') != offer:
                  raise SystemExit('Unexpected article in attributes response')
              return row

          def read_prices():
              return api('/v5/product/info/prices', {'filter': product_filter, 'limit': 1})['items'][0]

          previous = read_product()
          original = read_attributes()
          pricing = read_prices()
          price = pricing['price']
          if float(price['price']) != 299 or price.get('currency_code') != 'RUB':
              raise SystemExit('Unexpected seller price; preserve the existing offer')
          packing = [180, 130, 40, 70]
          if dimensions(original) != packing:
              raise SystemExit('Confirmed package is not active')
          if review_status(previous) is None:
              raise SystemExit('Cannot verify the paid review switch')
          warehouse_id = 1020005032543350

          def inventory():
              return api('/v2/product/info/stocks-by-warehouse/fbs', {
                  'offer_id': [offer], 'limit': 100, 'cursor': '',
              })['products']

          def warehouse_state(rows):
              matching = next((row for row in rows if int(row['warehouse_id']) == warehouse_id), {})
              return {key: int(matching.get(key) or 0) for key in ('present', 'free_stock', 'reserved')}

          prior_inventory = inventory()
          if os.environ.get('GITHUB_RUN_ATTEMPT') != '1':
              private_report({'stock': warehouse_state(prior_inventory), 'reviews_enabled': review_status(previous),
                              'status': previous['statuses'], 'price': pricing})
              raise SystemExit(0)
          if any(int(row.get(key) or 0) for row in prior_inventory
                 for key in ('present', 'free_stock', 'reserved')):
              raise SystemExit('Existing FBS stock or reservations; do not reset them')
          root = 'https://raw.githubusercontent.com/Kondrat71/knd-3d-media/a18acff950c851e2f72dc96a2c646efd859b0949/photos/axolotl-keychains/'
          if review_status(previous):
              category = {'description_category_id': int(original['description_category_id']),
                          'type_id': int(original['type_id'])}
              if category != {'description_category_id': 17027899, 'type_id': 87458885}:
                  raise SystemExit('Unexpected catalog category')
              attributes = []
              for attr in original['attributes']:
                  if attr.get('complex_id') not in (None, 0) or attr['id'] in (21837, 21841):
                      continue
                  values = []
                  for value in attr['values']:
                      if value.get('dictionary_value_id'):
                          values.append({'dictionary_value_id': value['dictionary_value_id']})
                      elif value.get('value') is not None:
                          values.append({'value': value['value']})
                  if values:
                      attributes.append({'id': attr['id'], 'values': values})
              complex_attributes = original.get('complex_attributes') or []
              complex_attributes = [group for group in complex_attributes
                                    if not any(a.get('id') in (21841, 21837) for a in group.get('attributes', []))]
              complex_attributes.append({'attributes': [
                  {'complex_id': 100001, 'id': 21841, 'values': [{'value': root + 'overview.mp4'}]},
                  {'complex_id': 100001, 'id': 21837, 'values': [{'value': 'Аксолотли: цвета, размеры и крепление'}]},
              ]})
              item = {
                  **category, 'offer_id': offer, 'name': original['name'], 'attributes': attributes,
                  'complex_attributes': complex_attributes,
                  'promotions': [{'type': 'REVIEWS_PROMO', 'operation': 'DISABLE'}],
                  'currency_code': 'RUB', 'vat': str(price['vat']), 'price': str(price['price']),
                  'depth': packing[0], 'width': packing[1], 'height': packing[2], 'dimension_unit': 'mm',
                  'weight': packing[3], 'weight_unit': 'g',
                  'images': [f'{root}{index:02}.jpg' for index in range(1, 9)],
              }
              barcodes = previous.get('barcodes', [])
              if barcodes:
                  item['barcode'] = barcodes[0]
              old_price = float(price.get('old_price') or 0)
              if old_price > 0:
                  item['old_price'] = str(price['old_price'])
              task = api('/v3/product/import', {'items': [item]})['result']['task_id']
              for _ in range(14):
                  time.sleep(5)
                  rows = api('/v1/product/import/info', {'task_id': task})['result']['items']
                  row = next((entry for entry in rows if entry.get('offer_id') == offer), None)
                  if row and row.get('status') not in ('pending', 'processing'):
                      print('REVIEW_SETTING_IMPORT', row['status'], safe_errors(row.get('errors')), flush=True)
                      if row['status'] not in ('imported', 'success'):
                          raise SystemExit('Package import not accepted')
                      break
              else:
                  raise SystemExit('Package import pending')
          for _ in range(10):
              product = read_product()
              if review_status(product) is False and not product.get('errors'):
                  break
              time.sleep(6)
          else:
              private_report({'reviews_enabled': review_status(product), 'errors': safe_errors(product.get('errors')),
                              'status': product['statuses'], 'stock': warehouse_state(inventory())})
              raise SystemExit('Paid reviews are not confirmed inactive')

          rating = read_rating()['rating']
          current = read_attributes()
          pricing = read_prices()
          price_fields = pricing['price']
          seller_price = Decimal(str(price_fields['marketing_seller_price']))
          declared_price = Decimal(str(price_fields['price']))
          if (rating < 80 or seller_price != 299 or declared_price != 299 or
                  dimensions(current) != packing or float(pricing['volume_weight']) > 0.2):
              raise SystemExit('The verified content, price or package changed after reimport')

          fees = pricing['commissions']
          max_logistics = sum(Decimal(str(fees[field])) for field in (
              'fbs_direct_flow_trans_max_amount', 'fbs_first_mile_max_amount', 'fbs_deliv_to_customer_amount',
          ))
          fee_percent = Decimal(str(fees['sales_percent_fbs'])) / 100
          acquiring = Decimal(str(pricing['acquiring']))
          # Use the store model including labor, equipment wear and a returns reserve.
          fixed_cost = Decimal('107.27')
          contribution_before_tax = seller_price * (1 - fee_percent) - acquiring - max_logistics - fixed_cost
          profit = {str(tax): (contribution_before_tax - seller_price * tax).quantize(Decimal('.01'))
                    for tax in (Decimal('.04'), Decimal('.06'))}
          if min(profit.values()) <= 0:
              private_report({'max_fbs': str(max_logistics), 'profit': {k: str(v) for k, v in profit.items()},
                              'stock': warehouse_state(inventory()), 'reviews_enabled': review_status(product)})
              raise SystemExit('Maximum-route cost is above the accepted limit')

          active_marketing = (pricing.get('marketing_actions') or {}).get('actions') or []
          if active_marketing:
              raise SystemExit('An existing discount action requires review before release')
          result = api('/v2/products/stocks', {'stocks': [
              {'offer_id': offer, 'warehouse_id': warehouse_id, 'stock': 10},
          ]})['result']
          if len(result) != 1 or not result[0].get('updated'):
              private_report({'stock_update': result, 'stock': warehouse_state(inventory())})
              raise SystemExit('Ozon did not accept the FBS allocation')
          print('FBS_ALLOCATION_ACCEPTED', flush=True)
          for _ in range(10):
              stock = warehouse_state(inventory())
              if stock['present'] == 10 or stock['free_stock'] + stock['reserved'] == 10:
                  break
              time.sleep(6)
          product = read_product()
          private_report({'stock': stock, 'reviews_enabled': review_status(product), 'rating': rating,
                          'status': product['statuses'], 'max_fbs': str(max_logistics),
                          'profit': {key: str(value) for key, value in profit.items()},
                          'price': str(seller_price), 'dimensions': packing, 'sku': expected_sku})
          if stock['present'] != 10 and stock['free_stock'] + stock['reserved'] != 10:
              raise SystemExit('Ozon accepted the FBS allocation; final stock read is pending')
