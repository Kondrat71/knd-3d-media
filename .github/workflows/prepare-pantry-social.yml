name: Prepare pantry clips social image
on:
  push:
    paths:
      - '.github/workflows/prepare-pantry-social.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fit catalogue image to Instagram without cropping
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          p = Path('photos/pantry-clips')
          im = ImageOps.exif_transpose(Image.open(p/'01.jpg')).convert('RGB')
          im.thumbnail((1080, 1350), Image.Resampling.LANCZOS)
          canvas = Image.new('RGB', (1080, 1350), im.getpixel((0,0)))
          canvas.paste(im, ((1080-im.width)//2, (1350-im.height)//2))
          canvas.save(p/'social-2026-11-26.jpg', quality=95, optimize=True)
          PY
      - name: Save publication image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add photos/pantry-clips/social-2026-11-26.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Fit pantry clips catalogue image to Instagram'
            git push
          fi
