name: Ozon pantry clips
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ozon-pantry-clips.yml']
permissions: {}
jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Catalogue
        env:
          CID: ${{ secrets.OZON_CLIENT_ID }}
          KEY: ${{ secrets.OZON_API_KEY }}
        shell: python
        run: |
          import os,json,urllib.request,urllib.error,time
          def api(path, body):
              req=urllib.request.Request('https://api-seller.ozon.ru'+path,json.dumps(body).encode(),{'Client-Id':os.environ['CID'],'Api-Key':os.environ['KEY'],'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
              except urllib.error.HTTPError as e:
                  raise RuntimeError(str(e.code)+' '+e.read(1500).decode(errors='replace'))
          def walk(items,cat=0):
              for x in items:
                  c=x.get('description_category_id') or cat
                  if 'зажим' in x.get('type_name','').lower() and ('кухон' in x['type_name'].lower() or 'пакет' in x['type_name'].lower()):
                      t=x['type_id']
                      print('CATEGORY',c,t,x['type_name'])
                      for a in api('/v1/description-category/attribute',{'description_category_id':c,'type_id':t})['result']:
                          print(a['id'],a['name'],a['type'],a.get('dictionary_id'),a.get('is_required'))
                  walk(x.get('children',[]),c)
          walk(api('/v1/description-category/tree',{})['result'])
