name: Ozon pantry clips
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ozon-pantry-clips.yml']
permissions: {}
jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Catalogue
        env:
          CID: ${{ secrets.OZON_CLIENT_ID }}
          KEY: ${{ secrets.OZON_API_KEY }}
        shell: python
        run: |
          import os,json,urllib.request,urllib.error,time
          def api(path, body):
              req=urllib.request.Request('https://api-seller.ozon.ru'+path,json.dumps(body).encode(),{'Client-Id':os.environ['CID'],'Api-Key':os.environ['KEY'],'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
              except urllib.error.HTTPError as e:
                  raise RuntimeError(str(e.code)+' '+e.read(1500).decode(errors='replace'))
          common={'description_category_id':17027933,'type_id':92362}
          offer='KND-CLIP-6-OLIVE'
          root='https://raw.githubusercontent.com/Kondrat71/knd-3d-media/a178b7ab8a603a2682259f29102736fa52f5f0e9/photos/pantry-clips/'
          attrs=[]
          def literal(a,s):attrs.append({'id':a,'values':[{'value':s}]})
          def match(a,terms):
              for term in terms:
                  vals=api('/v1/description-category/attribute/values/search',{**common,'attribute_id':a,'value':term,'limit':30}).get('result',[])
                  best=next((v for v in vals if v['value'].casefold()==term.casefold() or (a==22232 and term in v['value'])),None)
                  if best:
                      attrs.append({'id':a,'values':[{'dictionary_value_id':best['id']}]})
                      return
              print('Unmatched attribute',a)
          match(85,['Нет бренда'])
          match(6383,['PET-G пластик','Пластик'])
          match(4389,['Россия'])
          match(10096,['оливковый','зеленый'])
          match(12171,['7,5','7.5'])
          match(23332,['Зажим для пакета','Зажим для пакетов'])
          match(22232,['3924100000'])
          attrs.append({'id':8229,'values':[{'dictionary_value_id':92362}]})
          literal(8513,'6')
          literal(23536,'false')
          literal(9048,'KND Зажимы для пакетов с подписями')
          literal(4384,'6 зажимов — по одному с надписями РИС, САХАР, КОФЕ, МАКАРОНЫ, МУКА и ГРЕЧКА.')
          literal(4191,'Набор из шести кухонных зажимов для открытых пакетов с крупами, мукой, сахаром, макаронами и кофе. На оливковой основе каждого зажима напечатано название продукта белыми выпуклыми буквами. Сложите верхний край пакета и надвиньте зажим сбоку вдоль сгиба. Надпись выступает над краем, поэтому её видно спереди. Чтобы открыть пакет, сдвиньте зажим обратно. Длина зажима 7,5 см, ширина 1,6 см. Зажим крепится снаружи упаковки.')
          def block(pic,title,caption):
              img=root+pic+'.jpg'
              return {'img':{'src':img,'srcMobile':img,'alt':title},'title':{'content':[title],'size':'size4','align':'left','color':'color1'},'text':{'content':[caption],'size':'size2','align':'left','color':'color1'},'reverse':False}
          literal(11254,json.dumps({'version':0.3,'content':[{'widgetName':'raShowcase','type':'chess','blocks':[block('02','На пачке кофе','Надпись видна над сгибом пакета.'),block('03','Как надеть зажим','Подверните верх пакета. Надвиньте зажим сбоку вдоль сгиба.')]}]},ensure_ascii=False))
          images=[root+f'{n:02}.jpg' for n in range(1,11)]
          for url in images:
              with urllib.request.urlopen(url,timeout=20) as response: assert response.read(2)==b'\xff\xd8'
          item={**common,'offer_id':offer,'name':'Зажимы для пакетов с подписями продуктов, 7,5 см, 6 шт.','attributes':attrs,'images':images,'currency_code':'RUB','vat':'0','dimension_unit':'mm','weight_unit':'g','complex_attributes':[{'attributes':[{'complex_id':100001,'id':21841,'values':[{'value':root+'overview.mp4'}]},{'complex_id':100001,'id':21837,'values':[{'value':'Кухонные зажимы — состав набора, размеры и применение'}]}]}]}
          item.update(depth=100,width=50,height=30)
          task=api('/v3/product/import',{'items':[item]})['result']['task_id']
          for _ in range(10):
              time.sleep(5)
              rows=api('/v1/product/import/info',{'task_id':task})['result']['items']
              if rows and all(x.get('status') not in ('pending','processing') for x in rows):
                  print('UPDATE',[(x['product_id'],x['status'],[(e['field'],e['code']) for e in x.get('errors',[])]) for x in rows])
                  break
          p=api('/v3/product/info/list',{'offer_id':[offer]})['items'][0]
          print('CARD',p.get('sku'),p.get('statuses'),len(p.get('images',[])))
          if p.get('sku'):
              for row in api('/v1/product/rating-by-sku',{'skus':[str(p['sku'])]}).get('products',[]):
                  print('RATING',row.get('rating'),[(x['key'],x['rating']) for x in row.get('groups',[])])
