name: Ozon key tags
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ozon-keytags.yml']
permissions: {}
jobs:
  item:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare key tags
        shell: python
        env:
          CID: ${{ secrets.OZON_CLIENT_ID }}
          KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          import os, json, urllib.request, urllib.error, time
          def api(path, obj):
              req=urllib.request.Request('https://api-seller.ozon.ru'+path,data=json.dumps(obj).encode(),headers={'Client-Id':os.environ['CID'].strip(),'Api-Key':os.environ['KEY'].strip(),'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
              except urllib.error.HTTPError as e:
                  raise RuntimeError(str(e.code)+' '+e.read(1200).decode(errors='replace'))
          offers=['KND-DOM-DACHA-2','KND-DOM-BLK-1','KND-DACHA-RED-1','KND-DOM-DACHA-BO-2','KND-DOM-DACHA-MIX-4']
          for i in range(4):
              products=api('/v3/product/info/list',{'offer_id':offers})['items']
              for p in products:print('CARD',p['offer_id'],p.get('sku'),p.get('model_info'),p.get('statuses',{}).get('status_name'),len(p.get('images',[])),p.get('errors',[]),flush=True)
              if len(products)==len(offers) and all(p.get('sku') for p in products):break
              time.sleep(12)
          prices=api('/v5/product/info/prices',{'filter':{'offer_id':offers,'visibility':'ALL'},'limit':10})
          for p in prices['items']:print('FEES',p['offer_id'],p.get('commissions'),p.get('acquiring'),flush=True)
          skus=[str(p['sku']) for p in products if p.get('sku')]
          if skus:
              data=api('/v1/product/rating-by-sku',{'skus':skus})
              for row in data.get('products',data.get('result',[])):
                  print('RATING',row.get('sku'),row.get('rating'),flush=True)
                  if str(row.get('sku'))==str(next((p.get('sku') for p in products if p.get('offer_id')==offers[0]),'')): print('DETAIL',row,flush=True)
