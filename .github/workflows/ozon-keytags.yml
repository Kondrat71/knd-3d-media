name: Ozon key tags
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ozon-keytags.yml']
permissions: {}
jobs:
  item:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare key tags
        shell: python
        env:
          CID: ${{ secrets.OZON_CLIENT_ID }}
          KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          import os, json, urllib.request, urllib.error, time
          def api(path, obj):
              req=urllib.request.Request('https://api-seller.ozon.ru'+path,data=json.dumps(obj).encode(),headers={'Client-Id':os.environ['CID'].strip(),'Api-Key':os.environ['KEY'].strip(),'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
              except urllib.error.HTTPError as e:
                  raise RuntimeError(str(e.code)+' '+e.read(1200).decode(errors='replace'))
          if os.environ.get('GITHUB_RUN_ATTEMPT') != '1':raise SystemExit('One-time allocation')
          offers=['KND-DOM-BLK-1','KND-DACHA-RED-1','KND-DOM-DACHA-BO-2','KND-DOM-DACHA-MIX-4']
          wid=1020005032543350
          def inventory():
              return api('/v2/product/info/stocks-by-warehouse/fbs',{'offer_id':offers,'limit':100,'cursor':''})['products']
          prior=inventory()
          if any(int(x.get('present',0)) or int(x.get('reserved',0)) for x in prior):raise SystemExit('Existing allocation found')
          result=api('/v2/products/stocks',{'stocks':[{'offer_id':o,'warehouse_id':wid,'stock':10} for o in offers]})['result']
          print('UPDATE',result,flush=True)
          if len(result)!=4 or not all(x['updated'] for x in result):raise SystemExit('Review partial update')
          for i in range(12):
              time.sleep(5)
              rows={x['offer_id']:(x['free_stock'],x['reserved']) for x in inventory() if int(x['warehouse_id'])==wid}
              print('VERIFIED',rows,flush=True)
              if rows=={o:(10,0) for o in offers}:break
          else:raise SystemExit('Verification pending')
          
