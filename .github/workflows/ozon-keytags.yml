name: Ozon key tags
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ozon-keytags.yml']
permissions: {}
jobs:
  item:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare key tags
        shell: python
        env:
          CID: ${{ secrets.OZON_CLIENT_ID }}
          KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          import os, json, urllib.request, urllib.error, time
          def api(path, obj):
              req=urllib.request.Request('https://api-seller.ozon.ru'+path,data=json.dumps(obj).encode(),headers={'Client-Id':os.environ['CID'].strip(),'Api-Key':os.environ['KEY'].strip(),'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
              except urllib.error.HTTPError as e:
                  raise RuntimeError(str(e.code)+' '+e.read(1200).decode(errors='replace'))
          offer='KND-DOM-DACHA-2'
          wid=1020005032543350
          def inventory():
              return api('/v2/product/info/stocks-by-warehouse/fbs',{'offer_id':[offer],'limit':100,'cursor':''})['products']
          if os.environ.get('GITHUB_RUN_ATTEMPT')!='1':raise SystemExit('One-time allocation; use a fresh inventory count')
          if any(int(x.get('present',0)) or int(x.get('reserved',0)) for x in inventory()):raise SystemExit('Inventory changed')
          p=api('/v5/product/info/prices',{'filter':{'offer_id':[offer],'visibility':'ALL'},'limit':1})['items'][0]
          assert float(p['price']['price'])==299
          res=api('/v2/products/stocks',{'stocks':[{'offer_id':offer,'warehouse_id':wid,'stock':50}]})
          print('UPDATE',res,flush=True)
          if not all(x['updated'] for x in res['result']):raise SystemExit('Update rejected')
          for i in range(10):
              time.sleep(5)
              rows=inventory()
              print('READBACK',rows,flush=True)
              if any(int(x.get('present',0))==50 for x in rows):break
