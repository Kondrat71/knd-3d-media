name: Ozon key tags
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ozon-keytags.yml']
permissions: {}
jobs:
  item:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare key tags
        shell: python
        env:
          CID: ${{ secrets.OZON_CLIENT_ID }}
          KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          import os, json, urllib.request, urllib.error, time
          def api(path, obj):
              req=urllib.request.Request('https://api-seller.ozon.ru'+path,data=json.dumps(obj).encode(),headers={'Client-Id':os.environ['CID'].strip(),'Api-Key':os.environ['KEY'].strip(),'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
              except urllib.error.HTTPError as e:
                  raise RuntimeError(str(e.code)+' '+e.read(1200).decode(errors='replace'))
          offer='KND-DOM-DACHA-2'
          for a in api('/v1/description-category/attribute',{'description_category_id':17027899,'type_id':87458885})['result']:
              print(a['id'],a['name'],a.get('is_aspect'))
          p=api('/v3/product/info/list',{'offer_id':[offer]})['items'][0]
          print('STATUS',p.get('statuses'),p.get('errors'))
          print('PRICE',api('/v5/product/info/prices',{'filter':{'offer_id':[offer],'visibility':'ALL'},'limit':1})['items'][0]['commissions'])
