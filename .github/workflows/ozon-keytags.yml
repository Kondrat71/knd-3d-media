name: Ozon key tags
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ozon-keytags.yml']
permissions: {}
jobs:
  item:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare key tags
        shell: python
        env:
          CID: ${{ secrets.OZON_CLIENT_ID }}
          KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          import os, json, urllib.request, urllib.error, time
          def api(path, obj):
              req=urllib.request.Request('https://api-seller.ozon.ru'+path,data=json.dumps(obj).encode(),headers={'Client-Id':os.environ['CID'].strip(),'Api-Key':os.environ['KEY'].strip(),'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
              except urllib.error.HTTPError as e:
                  raise RuntimeError(str(e.code)+' '+e.read(1200).decode(errors='replace'))
          res=api('/v1/product/import/prices',{'prices':[{'offer_id':'KND-DOM-DACHA-MIX-4','price':'300','min_price':'300','currency_code':'RUB','auto_action_enabled':'DISABLED'}]})
          print('PRICE UPDATE',res,flush=True)
          time.sleep(20)
          offers=['KND-DOM-DACHA-2','KND-DOM-BLK-1','KND-DACHA-RED-1','KND-DOM-DACHA-BO-2','KND-DOM-DACHA-MIX-4']
          products=api('/v3/product/info/list',{'offer_id':offers})['items']
          for p in products:print('CARD',p['offer_id'],p['sku'],p.get('model_info'),p['statuses']['status_name'],p.get('errors',[]))
          for p in api('/v5/product/info/prices',{'filter':{'offer_id':offers,'visibility':'ALL'},'limit':10})['items']:
              c=p['commissions']
              print('COST',p['offer_id'],c['sales_percent_fbs'],p['acquiring'],c['fbs_first_mile_max_amount'],c['fbs_direct_flow_trans_max_amount'],c['fbs_deliv_to_customer_amount'],c['fbs_return_flow_amount'])
          skus=[str(p['sku']) for p in products if p.get('sku')]
          for row in api('/v1/product/rating-by-sku',{'skus':skus}).get('products',[]):
              print('RATING',row['sku'],row['rating'],[(x['key'],x['rating']*x['weight']/100) for x in row['groups']])
